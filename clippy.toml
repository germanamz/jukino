# Thresholds from CONVENTIONS.md (decision D1). Clippy counts `self` as a parameter
# and counts the function body plus any enclosing `impl` or inline `mod` as nesting
# levels, so these values mean: at most `self` + 3 parameters, and at most three
# nested blocks inside a method.
too-many-lines-threshold = 30
cognitive-complexity-threshold = 15
too-many-arguments-threshold = 4
excessive-nesting-threshold = 5

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true
