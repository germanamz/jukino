# Supply-chain rules, checked by `cargo deny check`. See CONVENTIONS.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

# Licenses compatible with Jukino's Apache-2.0 license. Add one only when a real
# dependency needs it and it is compatible.
[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
